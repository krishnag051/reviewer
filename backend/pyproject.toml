[project]
name = "tp-review-backend"
version = "0.1.0"
description = "TP Review System backend — FastAPI + Postgres"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10",
    "pypdf>=4.0",
    # --- rule-checking agent wiring (2026-07-30) ---
    # app/agent_client.py (Round 66 — was app/rule_engine/client.py before
    # that refactor) imports agent-making/agent/pipeline/api.py by path
    # (not as an installed package — see agent_client.py's comment), but
    # that module's own import chain (pipeline/__init__.py -> integrity.py
    # -> judge.py -> render.py / model_provider.py) needs these at import
    # time, in WHICHEVER process does the importing — that's this backend
    # process, not just agent-making's own. Versions matched to
    # agent-making/agent/requirements.txt.
    "anthropic>=0.68.0",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.24.0",
    # agent-making Round 59 added pipeline/model_provider.py's OpenRouter
    # support (a plain `requests.post`, no new SDK) -- this transitive
    # need was never propagated into this list until Round 66, when this
    # backend's own test suite actually re-imported pipeline.api for the
    # first time since Round 59 landed and hit the resulting
    # ModuleNotFoundError. Confirmed via the exact same failure live.
    "requests>=2.31.0",
    # Fix Round (2026-08-12) added rapidfuzz (QA-PPI-01 filename-vs-name
    # matching) and spacy (QA-PPI-06 narrative name-contamination) to
    # agent-making's own requirements.txt -- confirmed missing from here
    # during deploy-prep investigation (2026-08-13); without these,
    # importing pipeline.fields ImportErrors the first time either
    # checker actually runs. spacy ALSO needs its en_core_web_sm model
    # downloaded separately (not installable via pip alone) -- see
    # backend/Dockerfile's own build-stage RUN step for that.
    "rapidfuzz>=3.0.0",
    "spacy>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
